<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G2 Profile Manager — Tricentis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div id="top-bar-inner">
        <span id="app-title">G2 Profile Manager</span>
        <div id="product-selector-wrap">
          <label for="product-select">Product:</label>
          <select id="product-select"></select>
        </div>
      </div>
    </header>
    <main id="form-area">
      <div id="loading">Loading…</div>
      <form id="main-form" style="display:none"></form>
    </main>
    <div id="save-bar">
      <span id="save-product-name"></span>
      <span id="dirty-indicator" class="dirty-dot" title="Unsaved changes"></span>
      <button id="download-btn" type="button">Download JSON</button>
      <button id="save-btn" type="button">Save</button>
    </div>
  </div>
  <div id="toast"></div>
  <script src="main.js"></script>
</body>
</html>
